# Default profile = "local": running from the IDE against Docker Compose infra.
# Profiles "docker" and "k8s" override connection details further down.
spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/order_db?directConnection=true
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8081

app:
  outbox:
    relay:
      enabled: true
      poll-interval-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      # every metric carries the service name — lets one Grafana dashboard
      # filter/split by service
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

---
# Inside Docker Compose: infra reachable by container DNS name; JSON logs (ECS format)
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://mongodb:27017/order_db?replicaSet=rs0
  kafka:
    bootstrap-servers: kafka:9092

logging:
  pattern:
    console: # unset the plain-text pattern so structured logging takes over
  structured:
    format:
      console: ecs

---
# Kubernetes / OpenShift: everything injected via ConfigMap/Secret env vars
spring:
  config:
    activate:
      on-profile: k8s
  data:
    mongodb:
      uri: ${MONGODB_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

logging:
  structured:
    format:
      console: ecs
