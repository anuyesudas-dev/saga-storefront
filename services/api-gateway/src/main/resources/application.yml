spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8085/.well-known/jwks.json

server:
  port: 8080

gateway:
  upstreams:
    auth-service: http://localhost:8085
    inventory-service: http://localhost:8082
    order-service: http://localhost:8081
  jwt:
    issuer: ecommerce-auth
  cors:
    allowed-origins:
      - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8085/.well-known/jwks.json

gateway:
  upstreams:
    auth-service: http://auth-service:8085
    inventory-service: http://inventory-service:8082
    order-service: http://order-service:8081
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8090

logging:
  pattern:
    console:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: k8s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

gateway:
  upstreams:
    auth-service: ${AUTH_SERVICE_URI}
    inventory-service: ${INVENTORY_SERVICE_URI}
    order-service: ${ORDER_SERVICE_URI}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS}

logging:
  structured:
    format:
      console: ecs
