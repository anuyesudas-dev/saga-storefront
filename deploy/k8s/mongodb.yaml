# MongoDB: single-member replica set (transactions need a replica set) WITH
# authentication — the trade-off deliberately deferred in the compose phase.
# Auth in a replica set requires internal auth too, hence the keyFile; the
# official image creates the root user from MONGO_INITDB_* on first boot.
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None # headless: stable per-pod DNS (mongodb-0.mongodb)
  # pods must resolve their own rs member name BEFORE becoming ready
  # (the readiness probe itself runs rs.initiate)
  publishNotReadyAddresses: true
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        runAsUser: 999 # mongodb uid/gid in the official image
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # mongod refuses a keyFile that is group/other-readable, and secret
        # volumes cannot be chowned to the mongod user — copy + chmod 400.
        # rm first: the emptyDir outlives sandbox restarts, and a leftover
        # 400-mode file can't be overwritten by cp (only unlinked).
        - name: keyfile-prep
          image: mongo:7.0
          command:
            - sh
            - -c
            - rm -f /keyfile/keyfile && cp /secret/mongo-keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile
          volumeMounts:
            - name: keyfile-secret
              mountPath: /secret
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongod
          image: mongo:7.0
          # args, NOT command: k8s `command` would replace the image entrypoint,
          # and it is the entrypoint that creates the root user from MONGO_INITDB_*
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /keyfile/keyfile
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONGODB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONGODB_PASSWORD
          # liveness: is mongod answering at all (ping is auth-exempt)
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          # readiness: same self-initiating trick as compose — first success
          # also runs rs.initiate, so "ready" means transactions actually work
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --quiet --eval
                  "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb-0.mongodb:27017'}]}).ok }"
                  | grep -q 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
              readOnly: true
      volumes:
        - name: keyfile-secret
          secret:
            secretName: platform-secrets
            items:
              - key: MONGO_KEYFILE
                path: mongo-keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
