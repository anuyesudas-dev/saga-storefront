# api-gateway: Deployment + ClusterIP Service. The only service the browser
# talks to — validates JWTs against auth-service's JWKS and routes to the
# other services, which stay internal-only. No Mongo/Kafka of its own.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ecommerce/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent # local image, loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
            - name: AUTH_SERVICE_URI
              value: http://auth-service:8085
            - name: ORDER_SERVICE_URI
              value: http://order-service:8081
            - name: INVENTORY_SERVICE_URI
              value: http://inventory-service:8082
            - name: JWK_SET_URI
              value: http://auth-service:8085/.well-known/jwks.json
            - name: GATEWAY_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: GATEWAY_CORS_ALLOWED_ORIGINS
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes to start
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
