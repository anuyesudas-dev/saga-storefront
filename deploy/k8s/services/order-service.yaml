# order-service: Deployment + ClusterIP Service. Config follows the platform rule:
# non-secret wiring from the platform-config ConfigMap, credentials from the
# platform-secrets Secret — nothing environment-specific in the image.
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        # picked up by Prometheus kubernetes_sd relabeling
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: ecommerce/order-service:0.1.0
          imagePullPolicy: IfNotPresent # local image, loaded into the cluster
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONGODB_USERNAME
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONGODB_PASSWORD
            # assembled from the two secret refs above ($() is kubelet-side
            # interpolation) — the full URI never appears in any manifest
            - name: MONGODB_URI
              value: mongodb://$(MONGODB_USERNAME):$(MONGODB_PASSWORD)@mongodb-0.mongodb:27017/order_db?directConnection=true&authSource=admin
          # startup probe absorbs JVM boot time so liveness can stay tight
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes to start
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            # numeric uid: runAsNonRoot cannot verify a named USER (spring),
            # and an arbitrary uid also proves OpenShift-restricted compatibility
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
