name: ecommerce-platform

# Full local stack: Kafka (KRaft), MongoDB (single-node replica set), and the
# four services. Prometheus and Grafana join in the observability phases.
#
#   ./mvnw -DskipTests package                 # build the jars first
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Memory limits keep the whole stack inside a laptop budget (~3.5 GB).

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092" # host access for services run from the IDE / kcat
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # two data listeners: kafka:9092 inside the compose network,
      # localhost:29092 from the host (advertised names must match the reacher)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single broker: replication factor 1 everywhere (production: RF 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are created declaratively by the services (ADR: no auto-create)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 1g

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    # self-initiating healthcheck: first success also runs rs.initiate, making
    # the container "healthy" only once the replica set (and thus transactions)
    # actually works
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    mem_limit: 768m

  order-service:
    build:
      context: ../services/order-service
    image: ecommerce/order-service:0.1.0
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  inventory-service:
    build:
      context: ../services/inventory-service
    image: ecommerce/inventory-service:0.1.0
    container_name: inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  payment-service:
    build:
      context: ../services/payment-service
    image: ecommerce/payment-service:0.1.0
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  notification-service:
    build:
      context: ../services/notification-service
    image: ecommerce/notification-service:0.1.0
    container_name: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  auth-service:
    build:
      context: ../services/auth-service
    image: ecommerce/auth-service:0.1.0
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  api-gateway:
    build:
      context: ../services/api-gateway
    image: ecommerce/api-gateway:0.1.0
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  frontend:
    build:
      context: ../frontend
    image: ecommerce/frontend:0.1.0
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-8090}:8090"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:11.6.1
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # local-only convenience: no login wall; NEVER do this outside a laptop.
      # Override in infra/.env (see .env.example) to enable authentication.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "${GRAFANA_ANONYMOUS_ROLE:-Admin}"
      GF_AUTH_BASIC_ENABLED: "${GRAFANA_BASIC_AUTH_ENABLED:-false}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 || wget -qO- http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
